db.url=jdbc:mysql://localhost:3306/trasmum_servidor?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
db.user=trasmum
db.password=trasmum

# Servidor API Dados
servidor.porta=8080
servidor.https.enabled=false
servidor.https.porta=8443
servidor.https.keystore.path=keystore.jks
servidor.https.keystore.password=trasmum

# Autenticacao CEO
auth.tentativasMaximas=5
auth.duracaoBloqueioMinutos=5
auth.duracaoSessaoHoras=8

# DB retry
db.retry.maxTentativas=10
db.retry.delayMs=2000

# CORS — origem do frontend Vite (Docker sobrepõe via FRONTEND_ORIGEM)
frontend.origem=http://localhost:5173
